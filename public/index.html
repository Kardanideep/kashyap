          <section>
            <h2>Our Labour Law Compliance Services</h2>
            <p>We offer reliable, accurate, and timely consultancy for all statutory labour law requirements, ensuring your business is always protected.</p>
            <ul>
              <li><strong>Payroll Related Services</strong> — Complete payroll management, statutory deductions, and automated salary disbursement.</li>
              <li><strong>PF (Provident Fund Act, 1952)</strong> — EPF registration, monthly challan generation, returns filing, and employee claims processing.</li>
              <li><strong>ESI (Employee State Insurance Act, 1948)</strong> — ESI registration, monthly contribution processing, and employee medical benefit claims.</li>
              <li><strong>PT (Professional Tax Act)</strong> — State-specific professional tax registration and periodic returns filing.</li>
              <li><strong>Shop and Establishment Act</strong> — Registration, renewal, and compliance for business premises across Gujarat.</li>
              <li><strong>Bonus Act</strong> — Payment of Bonus Act compliance, surplus calculation, and timely disbursement.</li>
              <li><strong>Contract Labour Act (Regulation &amp; Abolition), 1970</strong> — Principal employer registration, contractor licensing, and compliance verification.</li>
              <li><strong>Minimum Wages Act, 1948</strong> — State-wise minimum wage advisory, D.A. adjustments, and compliant salary structuring.</li>
              <li><strong>Factory Act, 1948</strong> — Factory license procurement, renewals, statutory registers, and safety compliance.</li>
              <li><strong>Labour Welfare Fund Act</strong> — LWF registration and timely contributions to state welfare boards.</li>
              <li><strong>Gratuity Act (Payment of Gratuity Act, 1972)</strong> — Gratuity calculation, trust formation, and claims processing.</li>
              <li><strong>Digital Signature (DSC)</strong> — Class 3 DSC issuance and renewal for EPFO, ESIC, and MCA portals.</li>
              <li><strong>Workmen's Compensation Policy</strong> — Policy procurement and compensation claims management.</li>
            </ul>
